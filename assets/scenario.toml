# assets/scenario.toml

# === 1. 放置机器 ===
# 注意：refining_unit 的尺寸是 3x3
[[machines]]
proto_id = "refining_unit"
x = 0
y = 0
dir = "North"

# === 2. 放置传送带 ===
# 在机器下方 (0, -2) 放置一个向北流动的传送带，对着机器入口
[[belts]]
x = 0
y = -2
in_dir = "South"  # 接收来自南边的货
out_dir = "North" # 向北输送 (进入机器)

# 在机器下方更远一点 (0, -3)
[[belts]]
x = 0
y = -3
in_dir = "South"
out_dir = "North"

# === 3. 放置初始物品 ===
# 在 (0, -3) 的传送带上放一个矿石，测试它能不能流进机器
[[items]]
proto_id = "Amethyst Ore"
x = 0
y = -3
progress = 0.5